# ============================================================
#  ProGuard — Configuración para ControlSolutic / CORSERPARK
#  Solutic 3E · Versión 22.0
# ============================================================

# --- Entrada / Salida ---
-injars  dist/ControlSolutic.jar
-outjars dist/ControlSolutic-obf.jar

# --- Librerías del sistema (Java 9+, módulos jmod) ---
-libraryjars <java.home>/jmods/java.base.jmod(!**.jar;!module-info.class)
-libraryjars <java.home>/jmods/java.desktop.jmod(!**.jar;!module-info.class)
-libraryjars <java.home>/jmods/java.logging.jmod(!**.jar;!module-info.class)
-libraryjars <java.home>/jmods/java.sql.jmod(!**.jar;!module-info.class)
-libraryjars <java.home>/jmods/java.naming.jmod(!**.jar;!module-info.class)
-libraryjars <java.home>/jmods/java.xml.jmod(!**.jar;!module-info.class)

# --- Dependencias del proyecto ---
-libraryjars dist/lib/flatlaf-3.5.4.jar
-libraryjars dist/lib/sqlite-jdbc-3.50.3.0.jar
-libraryjars dist/lib/json-20231013.jar
-libraryjars dist/lib/dpfpenrollment.jar
-libraryjars dist/lib/dpfpverification.jar
-libraryjars dist/lib/dpjavapos.jar
-libraryjars dist/lib/dpotapi.jar
-libraryjars dist/lib/dpotjni.jar
-libraryjars dist/lib/dpuareu.jar
-libraryjars dist/lib/escpos-coffee-4.1.0.jar
-libraryjars dist/lib/jasperreports-6.0.0.jar
-libraryjars dist/lib/commons-collections-3.2.1.jar
-libraryjars dist/lib/commons-logging-1.2.jar
-libraryjars dist/lib/jakarta.persistence-2.2.3.jar
-libraryjars dist/lib/org.eclipse.persistence.core-2.7.12.jar
-libraryjars dist/lib/org.eclipse.persistence.jpa-2.7.12.jar
-libraryjars dist/lib/org.eclipse.persistence.jpa.jpql-2.7.12.jar
-libraryjars dist/lib/org.eclipse.persistence.moxy-2.7.12.jar
-libraryjars dist/lib/org.eclipse.persistence.antlr-2.7.12.jar
-libraryjars dist/lib/org.eclipse.persistence.asm-9.4.0.jar

# --- Opciones generales ---
-dontskipnonpubliclibraryclasses
-dontskipnonpubliclibraryclassmembers
-dontpreverify
-verbose
-target 1.8

# --- Punto de entrada principal ---
-keep class controlingreso.ControlIngreso {
    public static void main(java.lang.String[]);
}

# --- Licencia: mantener nombres para mensajes de error legibles ---
-keep class process.LicenciaManager { *; }
-keep class process.LicenciaManager$Resultado { *; }
-keep class process.LicenciaErrorDialog { *; }

# --- Dispositivo biométrico: el SDK llama nuestras clases por nombre ---
-keep class devices.** { *; }

# --- Swing: métodos llamados internamente por el framework ---
-keepclassmembers class * extends javax.swing.JComponent {
    protected void paintComponent(java.awt.Graphics);
    protected void paintBorder(java.awt.Graphics);
}
-keepclassmembers class * implements java.awt.event.ActionListener {
    public void actionPerformed(java.awt.event.ActionEvent);
}
-keepclassmembers class * implements java.awt.event.WindowListener {
    public void windowClosing(java.awt.event.WindowEvent);
    public void windowOpened(java.awt.event.WindowEvent);
    public void windowClosed(java.awt.event.WindowEvent);
    public void windowIconified(java.awt.event.WindowEvent);
    public void windowDeiconified(java.awt.event.WindowEvent);
    public void windowActivated(java.awt.event.WindowEvent);
    public void windowDeactivated(java.awt.event.WindowEvent);
}

# --- Serialización (evitar romper clases serializables) ---
-keepclassmembers class * implements java.io.Serializable {
    static final long serialVersionUID;
    private void writeObject(java.io.ObjectOutputStream);
    private void readObject(java.io.ObjectInputStream);
}

# --- Suprimir advertencias de librerías externas ---
-dontwarn com.lowagie.**
-dontwarn net.sf.jasperreports.**
-dontwarn org.eclipse.persistence.**
-dontwarn com.digitalPersona.**
